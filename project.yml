name: Murmur
options:
  bundleIdPrefix: com.costajohnt
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.4

targets:
  Murmur:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Sources/Assets.xcassets
        buildPhase: resources
      - path: Tests/fixtures/fixture.wav
        buildPhase: resources
    dependencies:
      - package: FluidAudio
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Murmur
        CFBundleDisplayName: Murmur
        # Set here, not in Sources/Info.plist: xcodegen regenerates that file
        # from this block on every `xcodegen generate`, which is why the bundle
        # version sat at the 1.0/1 default through v1.0.0, v1.1.0 and v1.2.0
        # while the git tag was the only real version of record.
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "4"
        # Regular app (no LSUIElement): dock icon + app switcher + real main
        # menu. Closing the History window keeps the pill/menubar running; only
        # ⌘Q quits.
        NSMicrophoneUsageDescription: "Murmur transcribes your speech locally."
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.costajohnt.murmur
        # Ad-hoc signing by default so a fresh clone builds without any
        # Apple cert. scripts/build.sh overrides these via the
        # DEVELOPMENT_TEAM / CODE_SIGN_IDENTITY env vars for real-cert builds.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Lets Swift call MurmurCatchNSException — the ObjC @try/@catch bridge
        # that keeps an installTap NSException from aborting the process.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Murmur-Bridging-Header.h

  # Unit tests for pure logic (audit item A6). No host application: the
  # SwiftUI App entry point makes @testable-importing the Murmur executable
  # target impractical without launching the whole app (mic/hotkey/Ollama
  # side effects). Instead the specific source files under test are compiled
  # a second time directly into this bundle - they have no UI/AVFoundation/
  # networking side effects at import time, only at call time, and the tests
  # below never invoke the networking or mic paths (AudioRecorder is here
  # only for its pure static append-with-cap step, #51).
  MurmurTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MurmurTests
      - path: Sources/Murmur/CleanupContext.swift
      - path: Sources/Murmur/TranscriptGuard.swift
      - path: Sources/Murmur/Log.swift
      - path: Sources/Murmur/AppSettings.swift
      - path: Sources/Murmur/OllamaClient.swift
      - path: Sources/Murmur/HistoryStore.swift
      - path: Sources/Murmur/BrainstemClient.swift
      - path: Sources/Murmur/AudioRecorder.swift
      - path: Sources/Murmur/AudioInputDevice.swift
      - path: Sources/Murmur/ObjCExceptionBridge.m
      - path: Sources/Murmur/ObjCExceptionBridge.h
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Murmur-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.costajohnt.murmur.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
