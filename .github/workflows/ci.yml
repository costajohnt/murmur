name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug)
        run: |
          xcodebuild \
            -project Murmur.xcodeproj \
            -scheme Murmur \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      # Before the Release build and install check, so a failure there never
      # hides the test result.
      - name: Run unit tests
        run: |
          xcodebuild \
            -project Murmur.xcodeproj \
            -scheme MurmurTests \
            -configuration Debug \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      # Built the same way release.yml builds it (ad-hoc signed, hardened
      # runtime) so test-install.sh exercises a real bundle. The release-cert
      # signing itself runs only in release.yml: the key stays out of CI runs.
      - name: Build (Release)
        run: |
          xcodebuild \
            -project Murmur.xcodeproj \
            -scheme Murmur \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            build

      - name: Test install.sh against the Release build
        if: github.event_name == 'push'
        run: scripts/test-install.sh
