name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug)
        run: |
          xcodebuild \
            -project Murmur.xcodeproj \
            -scheme Murmur \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      # Built the same way release.yml builds it - ad-hoc signed via
      # project.yml rather than unsigned - so this job exercises the artifact
      # users actually download, and test-install.sh below can verify it.
      - name: Build (Release)
        # macOS minutes bill at 10x; PRs verify Debug build + tests, the
        # Release configuration is checked on push to main only.
        if: github.event_name == 'push'
        run: |
          xcodebuild \
            -project Murmur.xcodeproj \
            -scheme Murmur \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            build

      # Same gate as the Release build above - this step has nothing to
      # install without it.
      - name: Test install.sh against the Release build
        if: github.event_name == 'push'
        run: scripts/test-install.sh

      - name: Run unit tests
        run: |
          xcodebuild \
            -project Murmur.xcodeproj \
            -scheme MurmurTests \
            -configuration Debug \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
