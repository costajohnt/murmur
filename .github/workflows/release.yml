name: Release

# Builds an ad-hoc-signed Release Murmur.app and attaches it as a zip to the
# GitHub release for the pushed tag. Not notarized: Gatekeeper will warn on
# first launch (right-click > Open, or `xattr -dr com.apple.quarantine`).
# Proper Developer ID signing + notarization needs cert secrets (issue #25).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release)
        run: |
          xcodebuild \
            -project Murmur.xcodeproj \
            -scheme Murmur \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            build

      - name: Zip app bundle
        run: |
          ditto -c -k --keepParent \
            build/DerivedData/Build/Products/Release/Murmur.app \
            "Murmur-${GITHUB_REF_NAME}.zip"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "Murmur-${GITHUB_REF_NAME}.zip" --clobber \
            || gh release create "$GITHUB_REF_NAME" "Murmur-${GITHUB_REF_NAME}.zip" \
                 --title "$GITHUB_REF_NAME" --generate-notes
